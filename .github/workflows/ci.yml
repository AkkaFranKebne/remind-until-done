# Checks on every pull request (design doc 6.3).
# deploy.yml also calls this workflow, so main is checked before every deploy.
name: ci

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # event_name keeps a dev deploy (push) and a prod deploy (manual run) from cancelling each other.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history, not only the last commit
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Scan for secrets (whole Git history)
        run: gitleaks git --redact --no-banner -v

  # Scans the code for security mistakes (Go, TypeScript/React, Dockerfiles, workflows).
  # Rules come from Semgrep's public registry; no account, no token, no metrics sent.
  # A line that was checked and is safe gets a "nosemgrep: <rule>" comment with the reason.
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # the rules download from semgrep.dev; don't let a hang block deploys
    container:
      # Pinned by digest, like docker-compose.yml. To upgrade: docker buildx imagetools inspect semgrep/semgrep:<version>
      image: semgrep/semgrep:1.179.0@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan for security mistakes
        run: >-
          semgrep scan --error --metrics=off
          --config p/default --config p/golang --config p/typescript --config p/react
          --config p/dockerfile --config p/github-actions

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      HUSKY: 0 # no Git hooks on CI machines
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # orval's output must be what api/swagger.json gives today: someone changed the
      # contract without regenerating, or edited a generated file by hand.
      - name: Generated API code matches api/swagger.json
        run: |
          npm run api:generate
          if [ -n "$(git status --porcelain -- src/lib/api/generated)" ]; then
            git status --short -- src/lib/api/generated
            git diff -- src/lib/api/generated
            echo "::error::src/lib/api/generated is out of date. Run 'npm run api:generate' in web/ and commit."
            exit 1
          fi
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      # The same tests with the clock 12 hours later (jest.setup.ts). A test that reads the
      # clock and only passes at some hours fails here, on the PR, instead of on a later run
      # at the wrong hour (the deploy).
      - name: Tests again, 12 hours later
        run: npm test
        env:
          TEST_CLOCK_SHIFT_H: 12
      - run: npm run build
      - name: The build has no test-only or mock code (MSW, faker, dev:mock data)
        run: npm run check:bundle
      - name: Storybook builds (every story compiles)
        run: npm run build-storybook

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: go test (database tests start their own Postgres in Docker)
        run: go test ./...
      - name: Migrations apply with the real Flyway (same setup as make migrate)
        working-directory: .
        run: |
          docker compose up -d --wait db
          docker compose run --rm flyway migrate
          docker compose run --rm flyway validate
      - name: to_jdbc.py tests (turns the Neon URL into Flyway settings in deploy.yml)
        working-directory: .
        run: python3 scripts/test_to_jdbc.py
      - name: govulncheck (known vulnerabilities in Go and dependencies)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Docker image builds
        run: docker build -t rud-api:ci .

  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.12.0
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
