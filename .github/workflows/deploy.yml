# Deploys the API (Cloud Run) and the web app (Firebase Hosting) (design doc 6.4).
# - Merge to main -> dev, automatically (not when the merge only changes docs).
# - Manual run ("Run workflow" in the Actions tab, on main, type "prod") -> prod.
#
# Security: only the "deploy" job logs in to Google Cloud. All building (npm, Vite,
# Docker) happens in the "build" job, which has no cloud access, so a hacked npm
# package can't steal the login. After the login, only firebase-tools and the Flyway
# image run; Flyway sees only the migrations folder and the database settings.
name: deploy

on:
  push:
    branches: [main]
    # A merge that only changes docs would deploy the same app again (and use Actions
    # minutes): skip it. Same doc rule as scripts/ci_changes.py.
    paths-ignore:
      - '**.md'
      - '.claude/**'
      - '.zed/**'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "prod" to deploy this commit to production'
        required: true

permissions:
  contents: read

# Never run two deploys to the same environment at once.
concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && 'prod' || 'dev' }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    # Deploys only ever come from main. Google refuses logins from other branches too (infra/wif.tf).
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.confirm == 'prod')
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # don't leave the GitHub token on disk

      - name: Build the API image
        run: |
          docker build -t rud-api:${{ github.sha }} api
          docker save rud-api:${{ github.sha }} | gzip > api-image.tar.gz

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the web app
        working-directory: web
        run: npm ci && npm run build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: |
            api-image.tar.gz
            web/dist
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && 'prod' || 'dev' }}
    permissions:
      contents: read
      id-token: write # lets GitHub prove its identity to Google (Workload Identity Federation)
    env:
      HUSKY: 0
      IMAGE: ${{ vars.IMAGE }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # don't leave the GitHub token on disk

      # Unpack into a separate folder, so the build can't overwrite checked-out files
      # (like package-lock.json). Only the two expected outputs are used.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: ${{ runner.temp }}/build

      - name: Take the built web app
        run: cp -R "$RUNNER_TEMP/build/web/dist" web/dist

      # No npm cache in this job: other jobs write that cache. Packages come fresh
      # from the registry, checked against the lockfile.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Installed BEFORE logging in, with install scripts off: no package code runs here.
      # After the login, only firebase-tools runs (pinned by package-lock.json).
      - name: Install deploy tools (no scripts)
        working-directory: web
        run: npm ci --ignore-scripts

      # Same image and version as local "make migrate" (docker-compose.yml).
      - name: Download Flyway
        run: docker compose --profile tools pull flyway

      - name: Log in to Google Cloud (no stored keys)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Push the API image
        run: |
          gunzip -c "$RUNNER_TEMP/build/api-image.tar.gz" | docker load
          docker tag rud-api:${{ github.sha }} "$IMAGE"
          gcloud auth configure-docker ${{ vars.REGION }}-docker.pkg.dev --quiet
          docker push "$IMAGE"

      # Before the new revision starts, so new code never runs against old tables (design doc 6.5).
      # If it fails, the deploy stops and the old revision keeps serving.
      # The database URL goes from Secret Manager into environment variables only:
      # never printed, never on a command line, and masked in case anything echoes it.
      - name: Migrate the database (Flyway)
        run: |
          # The owner's login (schema changes); the API itself logs in as rud_app (decision 86).
          DB_URL="$(gcloud secrets versions access latest --secret=database-migrate-url --project ${{ vars.PROJECT_ID }})"
          # Reviewed (semgrep, 2026-10-20): stopping log masking needs a changed workflow, and only
          # deploy.yml on main may log in to Google (infra/wif.tf), so a copy on a branch never
          # gets this secret. Nothing in this step prints before the masks (output goes into variables).
          # nosemgrep: yaml.github-actions.security.audit.unsafe-add-mask-workflow-command.unsafe-add-mask-workflow-command
          echo "::add-mask::$DB_URL"
          SETTINGS="$(printf '%s' "$DB_URL" | python3 scripts/to_jdbc.py)"
          while IFS='=' read -r key value; do export "$key=$value"; done <<< "$SETTINGS"
          # nosemgrep: yaml.github-actions.security.audit.unsafe-add-mask-workflow-command.unsafe-add-mask-workflow-command
          echo "::add-mask::$FLYWAY_PASSWORD"
          docker compose run --rm --no-deps -e FLYWAY_URL -e FLYWAY_USER -e FLYWAY_PASSWORD flyway migrate

      - name: Deploy the API to Cloud Run
        run: |
          gcloud run deploy rud-api \
            --project ${{ vars.PROJECT_ID }} \
            --region ${{ vars.REGION }} \
            --image "$IMAGE" \
            --quiet

      # Also proves the new revision reached the database when it started ("database":"ok").
      - name: Smoke test the API (Cloud Run URL)
        run: |
          BODY="$(curl --fail --silent --show-error --retry 5 --retry-all-errors "${{ vars.API_URL }}/api/v1/healthz")"
          echo "$BODY"
          jq -e '.database == "ok"' <<< "$BODY" > /dev/null

      # Sign-in is switched on: /me without a token must be refused.
      - name: Smoke test sign-in (401 without a token)
        run: |
          STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' --retry 5 --retry-all-errors "${{ vars.API_URL }}/api/v1/me")"
          echo "GET /api/v1/me without a token: $STATUS"
          test "$STATUS" = 401

      - name: Deploy the web app to Firebase Hosting
        working-directory: web
        run: npx firebase deploy --only hosting --project ${{ vars.PROJECT_ID }} --non-interactive

      - name: Smoke test through Firebase Hosting (the M0 check)
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors "${{ vars.APP_URL }}/api/v1/healthz"

      # The app's files: the phone asks "still the same?" on every open (a deploy shows up at once).
      # API answers: never stored anywhere (they're per user). See web/firebase.json and api/.../middleware_headers.go.
      - name: Smoke test caching headers
        shell: bash
        run: |
          APP="$(curl --fail --silent --show-error --retry 5 --retry-all-errors --dump-header - --output /dev/null "${{ vars.APP_URL }}/" | grep -i '^cache-control:' | tr -d '\r' | tr 'A-Z' 'a-z')"
          API="$(curl --fail --silent --show-error --retry 5 --retry-all-errors --dump-header - --output /dev/null "${{ vars.APP_URL }}/api/v1/healthz" | grep -i '^cache-control:' | tr -d '\r' | tr 'A-Z' 'a-z')"
          echo "app: $APP"
          echo "api: $API"
          test "$APP" = "cache-control: no-cache"
          test "$API" = "cache-control: no-store"
