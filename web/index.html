<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover lets the app use the full screen around the iPhone notch (design doc 5.9) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Remind Until Done: reminders that keep nagging until you tap Done."
    />

    <!-- The app supports light and dark mode, so the browser draws its own parts
         (form fields, scrollbars) to match the phone's setting. -->
    <meta name="color-scheme" content="light dark" />
    <!-- Browser bar colour (Android), one per mode: the brand violet and the dark page (index.css --accent-solid, dark --bg). -->
    <meta name="theme-color" content="#67298e" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#120d16" media="(prefers-color-scheme: dark)" />

    <!-- iPhone home screen app -->
    <meta name="apple-mobile-web-app-title" content="rud." />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Stop iOS turning numbers (like times) into phone links -->
    <meta name="format-detection" content="telephone=no" />

    <!-- Home screen install (decision 24): name, icons, standalone window. The service worker
         (src/sw.ts: app shell, pushes) is registered in main.tsx. Design: Inventory → Icons → App icon. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>rud.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
