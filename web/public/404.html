<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Not found · rud.</title>
  </head>
  <!--
    Hosting's 404, only for a missing build file under /assets/ (every other address opens the app,
    web/firebase.json). Plain HTML with no inline style or script: the Content-Security-Policy
    would block Firebase's own 404 page's inline styles and log a report for it.
  -->
  <body>
    <h1>Not found</h1>
    <p>This file isn't here anymore. <a href="/">Open rud.</a></p>
  </body>
</html>
